name: Publish Docker image

# Builds the Dockerfile and pushes it to GitHub Container Registry as
# ghcr.io/<owner>/mcp-server-synology, so a deployment can `docker pull` instead
# of cloning the repo and building locally. The tag triggers match
# pypi-publish.yml, so one release tag produces both the PyPI package and the
# image.
#
# No secrets to configure: pushing to the repository's own GHCR namespace works
# with the workflow's GITHUB_TOKEN and the `packages: write` permission below.
# GHCR creates a new package as private, so after the first successful run set
# the package visibility to public (Packages -> mcp-server-synology -> Package
# settings), otherwise `docker pull` needs a login.
on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
  # Lets a maintainer publish an `edge` image from a branch, e.g. to check the
  # workflow itself or to try the image before cutting a release.
  workflow_dispatch:

# Jobs get nothing by default; the one job below asks for what it needs.
permissions:
  contents: read

# Publishes are serialized, not just per-ref: overlapping releases (v1.9.0 then
# v1.9.1 within minutes) would race on the shared `1.9` and `latest` aliases,
# and the run that finishes last wins them — not necessarily the newest. One
# static group keeps every push in order. GitHub keeps one running and one
# pending run per group, so a third run arriving while two are queued cancels
# the middle one (it must be re-run manually) — releases here are cut one at a
# time, so that trade is fine.
# Never cancel in flight: a half-pushed multi-arch manifest is worse than
# waiting, and a cancelled release run would leave `latest` stale.
concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The arm64 half is built under QEMU emulation and dominates the runtime;
    # a cold run is a few minutes. This only stops a hang.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      # Nothing here pushes to git, so the job does not keep a credential
      # around (same reasoning as ci.yml).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # arm64 is not optional for this project: Synology sells ARM-based NAS
      # models, and a container running next to the NAS is a common deployment.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag 1.8.0 or v1.8.0 -> `1.8.0`, `1.8` and `latest`. The default
      # `latest=auto` flavor leaves `latest` (and the short `1.8` tag) alone for
      # pre-releases. The trigger above also accepts PEP 440 pre-release
      # spellings such as 1.9.0rc1 or v1.9.0rc1 (the repo's own tags are bare
      # `1.8.0`-style, and PyPI normalises away any leading `v`), which the
      # semver rules do not match, so the pep440 rule below gives those a
      # `1.9.0rc1` tag; without it metadata-action would emit no tags at all
      # and build-push-action would fail on the empty tag list. A manual run
      # from a branch -> `edge` only.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=pep440,pattern={{version}}
            type=raw,value=edge,enable=${{ github.ref_type == 'branch' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Carries org.opencontainers.image.source, which is what links the
          # package to this repository on GitHub.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
