name: CI

# Lint and unit tests on every PR and every push to main. Until this existed,
# nothing enforced the ruff rule set configured in pyproject.toml and nothing
# ran the test suite before a release tag, so both drifted.
on:
  pull_request:
  push:
    branches: [main]
  # Matches label-sync.yml and pypi-publish.yml. Without it there is no way to
  # re-run CI on demand -- after a flake, a runner outage, or a base-image
  # change -- short of pushing an empty commit.
  workflow_dispatch:

# This workflow only reads the repo. Without an explicit block the jobs inherit
# the repository default, which on older repos is write-all.
permissions:
  contents: read

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Without this a hung job sits until the 6-hour default. Lint is seconds of
    # work; anything past 5 minutes means something is wrong, not slow.
    timeout-minutes: 5
    steps:
      # v7, matching label-sync.yml. pypi-publish.yml still pins v4; leaving the
      # repo split across two majors invites diverging deprecation behaviour.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned deliberately. An unpinned ruff gains rules on its own release
      # schedule and turns a green PR red with no change to the code, which
      # teaches everyone to ignore the job. Bump it in its own commit;
      # dependabot already watches this file's actions.
      - run: pip install ruff==0.16.9
      - run: ruff check src/ tests/

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The full suite runs in well under a minute once dependencies are installed;
    # this is almost entirely `pip install` time. 15 minutes leaves generous
    # headroom on a cold cache and still stops a hang long before the 6-hour
    # default. A test that hangs is a real bug -- find it, don't wait on it.
    timeout-minutes: 15
    strategy:
      # Report every version's result; one old-version failure should not hide
      # the others.
      fail-fast: false
      matrix:
        # The floor from requires-python, through the newest classifier.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[test]"
      - name: Run unit tests
        # Deselect anything that talks to a real NAS. Two independent things
        # have to hold for that to be safe, so both are in place:
        #
        #  1. No credentials reach this runner, so conftest's `env_check`
        #     fixture skips every live test on its own.
        #  2. This marker filter, which holds even if someone later wires
        #     secrets in.
        #
        # The filter is the weaker of the two on its own -- it is only as good
        # as the markers. `test_auth_connectivity` was unmarked and reached the
        # NAS, and it logs in with deliberately wrong credentials, which feeds
        # DSM's auto-block counter; it is marked in this commit.
        run: pytest -m "not real_nas and not destructive"
