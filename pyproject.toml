[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501", "E402"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-synology"
version = "1.7.0"
description = "MCP server for Synology NAS"
readme = "README.md"
authors = [{ name = "Tony Li" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["synology", "nas", "dsm", "mcp", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "filelock>=3.12",
    "pycryptodome",
    "requests",
    "mcp>=2.2.0",
    "python-dotenv",
    "websockets>=17.0.1",
]

[project.urls]
Homepage = "https://github.com/atom2ueki/mcp-server-synology"
Repository = "https://github.com/atom2ueki/mcp-server-synology"
Issues = "https://github.com/atom2ueki/mcp-server-synology/issues"
Changelog = "https://github.com/atom2ueki/mcp-server-synology/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
synology-mcp = "mcp_server:cli"
mcp-server-synology = "mcp_server:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["mcp_server", "config", "multiclient_bridge"]
